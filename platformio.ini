; Stream Deck no ESP32-S3 JC3248W535 (3.5" 320x480 touch capacitivo, AXS15231B)
[env:jc3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; -- Memória: módulo N16R8 (16MB flash / 8MB PSRAM octal) --
; Usamos a tabela de particoes padrao do board (nao default_16MB.csv: nesta
; placa especifica ela trava o boot, provavelmente por nao bater com o
; layout real da flash). O app (~400KB) cabe tranquilo nela mesmo assim.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

; -- USB nativo do ESP32-S3 em modo composto: CDC (Serial/debug) + HID (teclado) --
; O board.json do esp32-s3-devkitc-1 fixa ARDUINO_USB_MODE=1 (USB-Serial/JTAG,
; sem HID) em build.extra_flags; sobrescrevemos via board_build.extra_flags
; (substitui, nao concatena) para usar o USB OTG nativo + TinyUSB (modo 0),
; unico modo que expoe HID.
board_build.extra_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9
    bblanchon/ArduinoJson @ ^7.2.0
    bitbank2/AnimatedGIF @ ^2.2.0
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
